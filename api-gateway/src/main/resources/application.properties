spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=waste-reporting-service
spring.cloud.gateway.routes[0].uri=lb://WASTE-REPORTING-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/waste/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=collector-management-service
spring.cloud.gateway.routes[1].uri=lb://COLLECTOR-MANAGEMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/collectors/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].id=pickup-scheduling-service
spring.cloud.gateway.routes[2].uri=lb://PICKUP-SCHEDULING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pickups/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
